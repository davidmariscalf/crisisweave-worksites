name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m py_compile worksites.py worksites_server.py server_runtime.py public_export.py audit_guard.py
      - run: python worksites.py --db /tmp/cw.db validate examples/worksites.jsonl
      - run: python -m unittest discover -s tests -v
      - name: Build container
        run: docker build -t crisisweave-worksites:test .
      - name: Smoke test container
        run: |
          docker run -d --rm --name cw-worksites-test \
            -e CW_COORDINATOR_TOKEN='ci-only-placeholder-token-1234567890' \
            -p 127.0.0.1:18787:8787 \
            crisisweave-worksites:test
          trap 'docker stop cw-worksites-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if python -c "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:18787/api/health',timeout=2); d=json.load(r); assert r.status==200 and d.get('ok')"; then
              docker exec cw-worksites-test python audit_guard.py verify >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs cw-worksites-test
          exit 1
