name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python worksites.py --db /tmp/cw.db validate examples/worksites.jsonl
      - run: python -m unittest discover -s tests -v
      - name: Build container
        run: docker build -t crisisweave-worksites:test .
      - name: Smoke test container
        run: |
          docker run -d --rm --name cw-worksites-test \
            -e CW_COORDINATOR_TOKEN='ci-only-placeholder-token-1234567890' \
            -p 127.0.0.1:18787:8787 \
            crisisweave-worksites:test
          trap 'docker stop cw-worksites-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if python - <<'PY'
import json, urllib.request
try:
    with urllib.request.urlopen('http://127.0.0.1:18787/api/health', timeout=2) as response:
        data = json.load(response)
        raise SystemExit(0 if response.status == 200 and data.get('ok') else 1)
except Exception:
    raise SystemExit(1)
PY
            then
              exit 0
            fi
            sleep 1
          done
          docker logs cw-worksites-test
          exit 1
