name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python worksites.py --db /tmp/cw.db validate examples/worksites.jsonl
      - run: python -m unittest discover -s tests -v
